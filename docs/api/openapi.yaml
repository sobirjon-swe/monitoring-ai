{
  "openapi": "3.1.0",
  "info": {
    "title": "Monitoring AI local foundation, synthetic ingestion, lifecycle and developer evidence",
    "version": "1.3.0",
    "description": "JSON syntax is valid YAML1.2. Local/testing loopback opaque bearer tokens only; production SSO and UI not implemented. Tenant/project scopes and current grants/membership are server-controlled. No T07 HTTP/model endpoint: analysis contracts are synthetic-only internal client. Responses may contain UTC PostgreSQL timestamp text, not uniformly RFC3339. HEAD uses the same read permissions and handler as GET and has an empty body; only POST/PATCH mutate. UTC timestamps preserve up to six fractional digits through validation, timestamptz(6) storage and event/access-time bindings. Periods remain [valid_from,valid_to) at microsecond precision. E02 I1/I2 provide synthetic-v1 manual-source connector bindings and bounded durable receipt/outbox acceptance. No real source API, webhook verification, raw receipt read, settings update, production worker identity or external AI inference. I3 local outbox processing and I4 projection/status are implemented and independently reviewed. Whole-unit code review found no Critical or Important blockers; dedicated dev incremental migrations000007/000008 and rollback-scoped synthetic acceptance/replay/CLI projection smoke were verified by the lead. Scoped metadata re-review approved. This synthetic foundation does not establish full E02 or production readiness. Source freshness remains unknown. E03 deterministic synthetic lifecycle implements versioned requirements/tasks, reviewed receipt links, synthetic QA, immutable baselines/human decisions, exact progress and selective durable applicability invalidation. R6 final whole-unit/scoped review, ten dev incrementals000009–000014, rollback smoke and218-test verification passed; no full E03/AC06 or production readiness claim. Lifecycle transport rejects extra authority fields, duplicate keys, decoded NUL and object/array ambiguity; max65536 bytes/depth16. No inference or live CI."
  },
  "servers": [
    {
      "url": "http://127.0.0.1:18080",
      "description": "Current configurable local development endpoint; port8000 belongs to another application and is preserved."
    }
  ],
