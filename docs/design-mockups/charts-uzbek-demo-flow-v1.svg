<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250"><rect width="1200" height="250" rx="20" fill="#19191c"/><g font-family="Segoe UI, sans-serif" fill="#f6f3f1"><text x="32" y="35" font-size="21">Uzbek demo va chartlar — taklif etilgan ma’lumot oqimi</text><g fill="#302c2d" stroke="#81716a"><rect x="32" y="62" width="246" height="104" rx="14"/><rect x="326" y="62" width="246" height="104" rx="14"/><rect x="620" y="62" width="246" height="104" rx="14"/><rect x="914" y="62" width="254" height="104" rx="14"/></g><g font-size="17" text-anchor="middle"><text x="155" y="94">Yangi DEMO tenant</text><text x="155" y="122">12 shaxs · 3 loyiha</text><text x="155" y="149" font-size="14">Eski yozuvlar saqlanadi</text><text x="449" y="94">Native servislar + audit</text><text x="449" y="122">Dalil → QA → qabul</text><text x="449" y="149" font-size="14">Soxta jami kiritilmaydi</text><text x="743" y="94">Ruxsatli aggregate API</text><text x="743" y="122">Loyiha + qamrov + limit</text><text x="743" y="149" font-size="14">Yashirin yozuvlar ochilmaydi</text><text x="1041" y="94">Liquid glass chartlar</text><text x="1041" y="122">Raqam + yorliq + holat</text><text x="1041" y="149" font-size="14">Noma’lum natija ≠ nol</text></g><g stroke="#ff8b47" stroke-width="3" fill="none"><path d="M286 114h30m-8-7 8 7-8 7M580 114h30m-8-7 8 7-8 7M874 114h30m-8-7 8 7-8 7"/></g><text x="32" y="204" fill="#d0cbc7" font-size="15">Faqat lokal synthetic muhit. Manba subyektlari tokensiz va tor doirada; demo kirishlari 8 soatlik.</text><text x="32" y="228" fill="#d0cbc7" font-size="15">Mavjud grantlar kengaytirilmaydi. Yangi demo grant matritsasi va DEV ishga tushirish alohida ko‘rib chiqiladi.</text></g></svg>
